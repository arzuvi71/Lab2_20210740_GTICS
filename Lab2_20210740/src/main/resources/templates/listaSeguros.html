<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Lista Seguros</title>
</head>
<body class="container mt-5">

<div th:replace="~{index :: navbar}"></div>
<h2 class="mt-4">Lista Seguros</h2>
<div class="mb-3">
  <a th:href="@{/employees/new}" class="btn btn-primary">Agregar Elemento</a>
</div>

<table class="table table-bordered">
  <thead class="table-light">
  <tr>
    <th>#</th>
    <th>Empresa Aseguradora</th>
    <th>Cobertura máxima</th>
    <th>Tarifa</th>
    <th></th>
    <th></th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="seguro : ${seguroList}">
    <td th:text="${seguro.idseguro}">1</td>
    <td th:text="${seguro.empresa}">Rimac</td>
    <td th:text="${seguro.cobertura}">15000</td>
    <td th:text="${seguro.tarifa}">30</td>
    <td>
      <a th:href="@{/seguro/edit(id=${seguro.idseguro})}" class="btn btn-sm btn-primary">Editar</a>
      <a th:href="@{/seguro/delete(id=${seguro.idseguro})}" class="btn btn-sm btn-danger">Borrar</a>
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>
