<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Lista Sedes</title>
</head>
<body class="container mt-5">

<div th:replace="~{index :: navbar}"></div>
<h2 class="mt-4">Lista Sedes</h2>
<div class="mb-3">
    <a th:href="@{/sede/new}" class="btn btn-primary">Agregar Elemento</a>
</div>

<table class="table table-bordered">
    <thead class="table-light">
    <tr>
        <th>#</th>
        <th>Distrito</th>
        <th>Dirección</th>
        <th></th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="sede : ${sedeList}">
        <td th:text="${sede.idsede}">1</td>
        <td th:text="${sede.distrito}">Steven</td>
        <td th:text="${sede.direccion}">King</td>

        <td>
            <a th:href="@{/sede/edit(id=${sede.idsede})}" class="btn btn-sm btn-primary">Editar</a>
            <a th:href="@{/sede/delete(id=${sede.idsede})}" class="btn btn-sm btn-danger">Borrar</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
